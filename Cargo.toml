[package]
name = "tspb"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "Terminal UI launcher for Spring Boot: index JDKs, Maven and launchable modules, start with one key, watch logs in place."
license = "MIT"
repository = "https://github.com/OriginZero/tspb"
readme = "README.md"
keywords = ["spring-boot", "tui", "launcher", "java", "maven"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
ansi-to-tui = "8.0.1"
anyhow = "1.0.104"
arboard = { version = "3.6.1", default-features = false }
chrono = "0.4.45"
crossterm = "0.29.0"
dirs = "6.0.0"
quick-xml = "0.42.0"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.10.9"
sysinfo = "0.39.6"
toml = "1.1.4"
walkdir = "2.5.0"
which = "8.0.5"
